[package]
name = "zt"
version = "0.3.1"
edition = "2024"
description = "Remote Zellij session manager for humans and automation"
license = "MIT"
repository = "https://github.com/YogevKr/zt"

[dependencies]
clap = { version = "4.6.1", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.2"
which = "8.0.2"
